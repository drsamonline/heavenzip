; fa.ini — FreeArc 'Next's configuration file.
;
; The name matters. FreeArc 'Next reads `fa.ini`, and the port in this vault globs
; `arc*.ini`; neither matches the other. A file called `arc.ini` is invisible to 'Next
; and `fa.ini` is invisible to the C port. Bulat Ziganshin, encode.su thread 2621:
;
;   "nothing set up in fa.ini, only fa32.exe extracted"
;   "what do I have to enter in fa.ini?"
;   "You can replace any of these definitions using 'Compression methods' section in
;    your fa.ini"
;
; `-mx` is not a switch of its own: it selects method `x`, and `x` is defined here. So
; this section is where a chain is composed, not merely tuned.

[Compression methods]
; The two overrides Bulat posts as the worked example — a DEFLATE-unwrapping stage
; before the repeat filter, and a different terminal coder:
;
;   9rep    = precomp+srep:m3f
;   9binary = zstd:22:d27
;
; With those, `-m9` stops being "LZMA at 254 MB" and becomes
;    precomp -> srep:m3f -> delta -> zstd:22:d27
; because `#b = #rep + #bx` and `#xb = delta + #binary` still apply.
;
; heavenzip has no fa.ini reader, so these are implemented as profiles instead —
; `fa-precomp-srep-zstd` in config/profiles/ is that chain with the delta stage left
; out (it measured worse on general binary, see docs/FREARC.md).

; Left as FreeArc ships them, for reference:
x  = 9
#  = #rep+#exe+#xb / $obj=#b / $text=#t
#b  = #rep + #bx
#xb = delta + #binary
9rep  = rep:2040m
9binary = lzma:254m:max
