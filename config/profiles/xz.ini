# xz, bundled. Same shape as zstd: no output argument, so stdout carries the result.
#
# It was `bin = xz` (PATH) until this bundle started carrying its own xz. The bundled
# binary is preferred because a release should not depend on the machine having one.
[route]
detect = any
pipeline = xz

[xz]
bin = bin/xz.exe
args = -9 -c {in}
reverse_args = -d -c {in}
stdout_to_output = true
