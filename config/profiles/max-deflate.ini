# Maximum compression for files that carry DEFLATE streams inside a container —
# PNG, JPEG, PDF, ZIP, DOCX, JAR.
#
# The chain is the one FreeArc users settled on: take the DEFLATE streams apart,
# then compress what is left with an LZ77 filter and finally with LZMA. Each stage
# sees what the previous one exposed.
#
#   precomp   unwraps the DEFLATE streams, storing them so they can be recompressed
#   srep      finds long repeats across the unpacked data
#   xz        LZMA over the result
#
# The order matters. LZMA first would compress the DEFLATE streams as opaque bytes
# and precomp would then find nothing to unwrap.
[route]
detect = media
pipeline = precomp,srep,xz

[precomp]
bin = bin/precomp.exe
args = -cn -o{out} {in}
reverse_args = -r -o{out} {in}
# precomp exits 2 when it finds nothing to recompress, having written a
# valid PCF; without this every chain that uses it fails on inputs with
# no DEFLATE stream (issue #93).
ok_exit = 0,2

[srep]
bin = bin/srep.exe
# All rights reserved; not redistributable in any form (TOOL_MANIFEST.md).
# Dropped with a notice when absent, per BUNDLING.md.
optional = true
args = -l256m -m3f
reverse_args = -d

[xz]
bin = bin/xz.exe
args = -9 -c {in}
reverse_args = -d -c {in}
stdout_to_output = true
