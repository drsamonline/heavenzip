# 7-Zip, through the adapter in tools/7z-wrap.
#
# 7-Zip is an archiver — `7z a ARCHIVE FILES`, `7z x ARCHIVE -oDIR` — so it cannot be
# a step as it stands. The wrapper stages the payload under a fixed name and gives the
# step one file in, one file out, the same shape zpaq needed.
[route]
detect = any
pipeline = sevenzip

[sevenzip]
bin = bin/7z-wrap
args = c {in} {out}
reverse_args = d {in} {out}
