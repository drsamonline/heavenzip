# NOT USABLE AS WRITTEN — kept as the design intent, not as a working profile.
#
# `preflate` does not build on POSIX (see docs/PACKAGING.md: `_ftelli64`/`_fseeki64`
# are MSVC-only in the vendored source), and its CLI is not `--in-place`: preflate
# splits a deflate stream into two files (`-s`) and recombines them (`-r`/`-x`),
# which does not fit a one-in-one-out step without an adapter. Running this profile
# will refuse at pre-flight, naming `bin/preflate.exe`, which is the honest outcome.
[route]
detect = media
pipeline = preflate,ziptastic

[preflate]
bin = bin/preflate.exe
args = --in-place

[ziptastic]
args = -9
