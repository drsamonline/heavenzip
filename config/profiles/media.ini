# Media files — PNG, JPEG, PDF, ZIP — where the interesting content is a DEFLATE
# stream inside a container.
#
# The engine already links preflate (`docs/LICENCES.md` in ziptastic: "preflate |
# Apache-2.0 | linked; the DEFLATE recompression"), so it recompresses those streams
# itself. This profile was written before that was checked, and routed through the
# standalone preflate CLI instead — which is the wrong tool for the job: `preflate -s`
# takes a *raw* deflate stream, not a PNG, and fails on one.
#
# So there is no second binary here and no platform restriction: this is the engine,
# with the media route.
[route]
detect = media
pipeline = ziptastic

[ziptastic]
args = -9
