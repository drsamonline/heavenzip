# Windows only, through tools/preflate-wrap.cmd.
#
# preflate has no `--in-place`: it splits a deflate stream into FILE.u and FILE.r and
# recombines them, so it needs an adapter to look like one-in-one-out. The wrapper is a
# batch script and the binary is MSVC-only, so this profile runs on Windows and refuses
# elsewhere, naming bin/preflate-wrap.cmd.
#
# It buys what nothing else here does: the deflate streams inside PNG, ZIP, PDF and
# gzip are re-compressed by the engine instead of being stored as they arrived.
[route]
detect = media
pipeline = preflate,ziptastic

[preflate]
bin = bin/preflate-wrap.cmd
args = c {in} {out}
reverse_args = d {in} {out}

[ziptastic]
args = -9
