[route]
detect = any
pipeline = srep,paq8px

[srep]
bin = bin/srep.exe
# All rights reserved; not redistributable in any form (TOOL_MANIFEST.md).
# Dropped with a notice when absent, per BUNDLING.md.
optional = true
args = -l256m -m5f
reverse_args = -d

[paq8px]
bin = bin/paq8px.exe
# All rights reserved; not redistributable in any form (TOOL_MANIFEST.md).
# Dropped with a notice when absent, per BUNDLING.md.
optional = true
args = -8
reverse_args = -d
