# The chain from the FreeArc world, with 7-Zip as the terminal stage:
#
#   precomp   unwrap the DEFLATE streams inside the container
#   srep      find long repeats in what is left
#   sevenzip  LZMA2 over the result, at -mx=9
#
# `max-deflate` is the same chain ending in xz. They are separate profiles rather than
# one with a switch because a profile is a claim about a pipeline, and these are two
# different claims to measure.
[route]
detect = media
pipeline = precomp,srep,sevenzip

[precomp]
bin = bin/precomp.exe
args = -cn -o{out} {in}
reverse_args = -r -o{out} {in}

[srep]
bin = bin/srep.exe
args = -l256m -m3f
reverse_args = -d

[sevenzip]
bin = bin/7z-wrap
args = c {in} {out}
reverse_args = d {in} {out}
