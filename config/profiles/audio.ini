# PCM audio, and anything else with a strong stride.
#
# FreeArc's `$wav => tta` is a dedicated audio coder we do not carry. Its `mm` filter is
# the other half of the answer, and `mm:2*8` is a delta of stride 2 — exactly what a
# 16-bit PCM stream needs, because consecutive samples differ by a small amount.
#
# xz has that filter. `--delta=dist=2` subtracts the sample two bytes back, which turns
# a smooth waveform into small numbers, and LZMA then codes those.
#
# `dist=2` is 16-bit mono or stereo; `dist=4` suits 32-bit. Getting this wrong makes the
# output larger, which is why it is a separate profile and not folded into `xz`.
[route]
detect = any
pipeline = audio

[audio]
bin = bin/xz.exe
args = --delta=dist=2 --lzma2=preset=9 -c {in}
reverse_args = -d -c {in}
stdout_to_output = true
