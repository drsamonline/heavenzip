# The strongest thing this release can do on its own.
#
# `max-ratio` also chains srep, which is all rights reserved and can never ship —
# so the strongest *shippable* path is paq8px alone. Slow and small; use it when
# the ratio matters more than the clock.
#
# paq8px is GPL-2+ and is bundled as a separate program with its source: see
# docs/PACKAGING.md. It is never linked into anything.
[route]
detect = any
pipeline = paq8px

[paq8px]
bin = bin/paq8px.exe
args = -8
reverse_args = -d
