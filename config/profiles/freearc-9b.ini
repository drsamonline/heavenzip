# FreeArc's `9b = 9rep + 9xb` expressed with what this bundle carries:
#
#   srep    FreeArc's `rep` — the long-range repeat filter
#   xz      LZMA at preset 9, which is what `9binary = lzma:254m:max` wants to be
#
# The difference is the dictionary: FreeArc asks for 254 MB and the encoder needs
# several times that in RAM. Preset 9's own 64 MB is what runs on a 2 GB machine —
# `docs/FREARC.md` records the measurements.
#
# FreeArc's `delta` stage is left out on purpose: it made a base64 file 14% larger.
[route]
detect = any
pipeline = srep,xz

[srep]
bin = bin/srep.exe
# All rights reserved; not redistributable in any form (TOOL_MANIFEST.md).
# Dropped with a notice when absent, per BUNDLING.md.
optional = true
args = -l256m -m5f
reverse_args = -d

[xz]
bin = bin/xz.exe
args = -9 -c {in}
reverse_args = -d -c {in}
stdout_to_output = true
