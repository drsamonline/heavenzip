# The profile that needs nothing but the engine.
#
# Every other shipped profile names a tool a release does not carry — `srep`
# (all rights reserved, cannot ship), `preflate`, `paq8px` — so a fresh install
# could not compress anything at all. This chains the bundled engine and nothing
# else, and it is the default.
[route]
detect = any
pipeline = ziptastic

[ziptastic]
args = -9
