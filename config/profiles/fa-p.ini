# FreeArc's `#p` chain, from the shipped arc.ini of FreeArc 0.67:
#
#   #p = maxprecomp + exe2 + maxsrep + #xb / $text=#t / ...
#   maxprecomp = precomp:intense
#   maxsrep    = srep:m3f:mem256mb
#
# `exe2` is FreeArc's executable filter (dispack070) and `#xb` ends in LZMA. This
# profile keeps the two stages this bundle has and drops `exe2`, which is an x86
# executable preprocessor — srep already covers the repeat-finding it does for
# non-executable data, and precomp covers the DEFLATE streams.
#
# `detect = media`: precomp refuses input with no DEFLATE stream.
[route]
detect = media
pipeline = precomp,srep,xz

[precomp]
bin = bin/precomp.exe
args = -cn -o{out} {in}
reverse_args = -r -o{out} {in}

[srep]
bin = bin/srep.exe
# All rights reserved; not redistributable in any form (TOOL_MANIFEST.md).
# Dropped with a notice when absent, per BUNDLING.md.
optional = true
args = -l256m -m3f
reverse_args = -d

[xz]
bin = bin/xz.exe
args = -9 -c {in}
reverse_args = -d -c {in}
stdout_to_output = true
