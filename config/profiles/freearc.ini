# FreeArc's `arc`, through the adapter in tools/arc-wrap.
#
# FreeArc is an archiver — `arc a ARCHIVE FILES`, `arc x ARCHIVE -oDIR` — and it needs
# two binaries: `arc` writes, `arc x` shells out to `unarc`. The adapter stages the
# payload and keeps both on PATH.
#
# The level is -m5: FreeArc's higher presets (-m9, -mx) resolve through a
# [Compression methods] table that ships as config, and without it `arc` answers
# "data compression failed (-2) method 9". -m4 and -m5 map to LZMA directly and work.
[route]
detect = any
pipeline = freearc

[freearc]
bin = bin/arc-wrap
args = c {in} {out}
reverse_args = d {in} {out}
