# Uncompressed BMP.
#
# The engine's bmp stage splits the colour planes and delta-codes each row, which is
# what makes a photographic bitmap compressible, and it fires inside `-9` without a
# flag of its own. This profile exists so the class has a route with a name: `bench`
# and `tools/sweep.py` attribute a measurement to a profile, and a profile that names
# its class refuses a file it is not for rather than compressing it as opaque bytes.
#
# `detect = bmp` is content: `BM` plus a DIB header Microsoft has shipped plus BI_RGB.
# An RLE or BITFIELDS bitmap is still a bitmap and stays `binary` — there are no
# planes to split, so claiming it here would only mis-attribute the result.
[route]
detect = bmp
pipeline = ziptastic

[ziptastic]
args = -9
