# zpaq from PATH, through the adapter in tools/zpaq-wrap.
#
# zpaq is an archiver, not a stream compressor: `zpaq a ARCHIVE FILES` and `zpaq x
# ARCHIVE -to DIR`. The wrapper stages the file under a fixed name so the restore is
# predictable, and gives the step the one-in-one-out shape every profile here uses.
#
# The wrapper must be reachable as `bin/zpaq-wrap` (the bundle places it there). If
# neither the wrapper nor zpaq is present, this profile refuses and names the program.
[route]
detect = any
pipeline = zpaq

[zpaq]
bin = bin/zpaq-wrap
args = c {in} {out}
reverse_args = d {in} {out}
