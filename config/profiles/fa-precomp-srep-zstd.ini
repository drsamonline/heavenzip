# The chain from Bulat Ziganshin's worked example in the FreeArc 'Next thread,
# expressed with what this bundle carries:
#
#   fa.ini:  9rep = precomp+srep:m3f
#            9binary = zstd:22:d27
#
# With `#b = #rep + #bx` and `#xb = delta + #binary`, -m9 becomes
#   precomp -> srep:m3f -> delta -> zstd:22:d27
#
# The delta stage is left out: measured on a base64 file it produced 71,428 bytes
# against 62,640 without it (docs/FREARC.md). Delta helps executables and PCM; it needs
# FreeArc's `$obj` class detection to apply safely, which heavenzip does not have.
# `detect = media`, not `any`: precomp refuses input with no DEFLATE stream in it —
# "None of the given compression and memory levels could be used" — so a text file
# fails at the first stage rather than passing through it.
[route]
detect = media
pipeline = precomp,srep,zstd

[precomp]
bin = bin/precomp.exe
args = -cn -o{out} {in}
reverse_args = -r -o{out} {in}

[srep]
bin = bin/srep.exe
# All rights reserved; not redistributable in any form (TOOL_MANIFEST.md).
# Dropped with a notice when absent, per BUNDLING.md.
optional = true
args = -l256m -m3f
reverse_args = -d

[zstd]
bin = bin/zstd.exe
args = -22 -c {in}
reverse_args = -d -c {in}
stdout_to_output = true
