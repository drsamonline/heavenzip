# zstd from PATH — no bundled binary, and none needed if the machine has one.
#
# `bin = zstd` is a bare name, so it is looked up on PATH rather than in bin/. The
# profile refuses with the name of the missing program when it is absent, which is the
# behaviour every profile here has.
[route]
detect = any
pipeline = zstd

[zstd]
bin = zstd
args = -19 -c {in}
reverse_args = -d -c {in}
stdout_to_output = true
