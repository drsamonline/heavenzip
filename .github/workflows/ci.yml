name: ci

# Phase 0 is a CLI skeleton and an INI parser, so this is short: build from cold,
# run the unit cases, and run the phase-0 exit test — `heavenzip validate` must
# exit 0 against the config this repository ships.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: The phase-0 exit test, called the way a user calls it
        # ctest runs it too; this runs it from the repository root with no
        # arguments, which is how `config/` is found in practice.
        run: |
          ./build/heavenzip version
          ./build/heavenzip validate
          ./build/heavenzip list-profiles
          ./build/heavenzip detect tests/fixtures/image.png
          ./build/heavenzip detect tests/fixtures/archive.zip
          ./build/heavenzip detect tests/fixtures/notes.txt

      - name: A command that is not built yet must refuse, not succeed
        run: |
          if ./build/heavenzip compress some-file; then
            echo "::error::compress exited 0; phase 0 does not implement it and must say so"
            exit 1
          fi
          echo "compress refused, as it should"
