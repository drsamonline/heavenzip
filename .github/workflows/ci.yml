name: ci

# Phase 0 is a CLI skeleton and an INI parser, so this is short: build from cold,
# run the unit cases, and run the phase-0 exit test — `heavenzip validate` must
# exit 0 against the config this repository ships.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j 2

      - name: Fetch the engine, so the real round trip runs instead of skipping
        # integration.real-engine skips when bin/ is empty. In CI it must not skip:
        # a phase whose test never executes is a phase nobody has run.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh release view -R drsamonline/ziptastic --json tagName --jq .tagName)"
          echo "engine release: $tag"
          gh release download "$tag" -R drsamonline/ziptastic \
            --pattern 'ziptastic-*-linux-x86_64' --dir bin/ --clobber
          gh release download "$tag" -R drsamonline/ziptastic \
            --pattern 'SHA256SUMS' --dir bin/ --clobber
          (cd bin && sha256sum -c SHA256SUMS --ignore-missing)
          chmod +x bin/ziptastic-*-linux-x86_64
          ./bin/ziptastic-*-linux-x86_64 version

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: The phase-0 exit test, called the way a user calls it
        # ctest runs it too; this runs it from the repository root with no
        # arguments, which is how `config/` is found in practice.
        run: |
          ./build/heavenzip version
          ./build/heavenzip validate
          ./build/heavenzip list-profiles
          ./build/heavenzip detect tests/fixtures/image.png
          ./build/heavenzip detect tests/fixtures/archive.zip
          ./build/heavenzip detect tests/fixtures/notes.txt
          ./build/heavenzip compress tests/fixtures/notes.txt --dry-run
          ./build/heavenzip compress tests/fixtures/random.bin --profile max-ratio --dry-run

      - name: A profile that does not apply must refuse, not crash
        run: |
          # `--profile media` on a text file: exit 1 with the reason, never an abort.
          if ./build/heavenzip compress tests/fixtures/notes.txt --profile media --dry-run; then
            echo "::error::a media profile matched a text file"
            exit 1
          fi
          echo "refused with a reason, as it should"

      - name: A command that is not built yet must refuse, not succeed
        run: |
          if ./build/heavenzip bench tests/fixtures; then
            echo "::error::bench exited 0; phase 6 does not implement it yet"
            exit 1
          fi
          echo "bench refused, as it should"

      - name: The round trip, called the way a user calls it
        # ctest runs tests/roundtrip.sh too; this is the same thing without ctest in
        # the middle, so a failure here points at the CLI rather than the harness.
        run: bash tests/roundtrip.sh ./build/heavenzip tests/fixtures
