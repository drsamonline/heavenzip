name: ci

# Phase 0 is a CLI skeleton and an INI parser, so this is short: build from cold,
# run the unit cases, and run the phase-0 exit test — `heavenzip validate` must
# exit 0 against the config this repository ships.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j 2

      - name: Fetch the engine, so the real round trip runs instead of skipping
        # integration.real-engine skips when bin/ is empty. In CI it must not skip:
        # a phase whose test never executes is a phase nobody has run.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh release view -R drsamonline/ziptastic --json tagName --jq .tagName)"
          echo "engine release: $tag"
          gh release download "$tag" -R drsamonline/ziptastic \
            --pattern 'ziptastic-*-linux-x86_64' --dir bin/ --clobber
          gh release download "$tag" -R drsamonline/ziptastic \
            --pattern 'SHA256SUMS' --dir bin/ --clobber
          (cd bin && sha256sum -c SHA256SUMS --ignore-missing)
          chmod +x bin/ziptastic-*-linux-x86_64
          ./bin/ziptastic-*-linux-x86_64 version

      - name: No pipeline into head under pipefail
        # This trap cost three CI cycles in one day. It is a lint now, because writing
        # it in docs/TRAPS.md did not stop it happening again.
        run: bash tools/check-pipes.sh

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: The repository's claims about itself must be true
        # VERSION, CMakeLists and syc.ini agreed on nothing; the badges said
        # "tests: none yet" and "build: phase 0" with eight suites registered and
        # the plan complete. Runs after Test so `ctest -N` has a build to read.
        run: python3 tools/check-claims.py

      - name: The phase-0 exit test, called the way a user calls it
        # ctest runs it too; this runs it from the repository root with no
        # arguments, which is how `config/` is found in practice.
        run: |
          ./build/heavenzip version
          ./build/heavenzip validate
          ./build/heavenzip list-profiles
          ./build/heavenzip detect tests/fixtures/image.png
          ./build/heavenzip detect tests/fixtures/archive.zip
          ./build/heavenzip detect tests/fixtures/notes.txt
          ./build/heavenzip compress tests/fixtures/notes.txt --dry-run
          ./build/heavenzip compress tests/fixtures/random.bin --profile plain --dry-run
          # `max-ratio` is srep + paq8px and both are unshippable, so it now refuses
          # with the reason instead of failing at the pre-flight — that is the correct
          # answer for a chain with nothing runnable left. The chain that still has
          # work to do without srep is `max-deflate`, and this asserts the drop is a
          # notice rather than a refusal.
          ./build/heavenzip compress tests/fixtures/image.png --profile max-deflate --dry-run
          # precomp exits 2 when it finds nothing to recompress, and `ok_exit = 0,2` in
          # the profile says so. A tiny PNG has no DEFLATE stream to find, which makes
          # it the case that proves the rule end to end: the chain must complete and
          # verify rather than stopping at the first step.
          rm -f /tmp/okexit.png.hzpkg /tmp/okexit.png.hzpipeline
          cp tests/fixtures/image.png /tmp/okexit.png
          ./build/heavenzip compress /tmp/okexit.png --profile max-deflate

      - name: A profile that does not apply must refuse, not crash
        run: |
          # `--profile media` on a text file: exit 1 with the reason, never an abort.
          if ./build/heavenzip compress tests/fixtures/notes.txt --profile media --dry-run; then
            echo "::error::a media profile matched a text file"
            exit 1
          fi
          echo "refused with a reason, as it should"

      - name: A payload without its manifest must refuse, not guess
        # Every command is implemented now, so the refusal worth testing is the one
        # that will still exist in a year: decompress cannot undo what it has no
        # record of.
        run: |
          cp tests/fixtures/notes.txt /tmp/orphan.txt.hzpkg
          if ./build/heavenzip decompress /tmp/orphan.txt.hzpkg --out /tmp/x; then
            echo "::error::decompress exited 0 with no manifest"
            exit 1
          fi
          echo "refused, as it should"

      - name: Bench over the fixtures
        # With the engine fetched above, the shipped `text` profile measures instead
        # of skipping; the others still name the binaries they need.
        run: ./build/heavenzip bench tests/fixtures/ || true

      - name: The round trip, called the way a user calls it
        # ctest runs tests/roundtrip.sh too; this is the same thing without ctest in
        # the middle, so a failure here points at the CLI rather than the harness.
        run: bash tests/roundtrip.sh ./build/heavenzip tests/fixtures
