name: build-windows-tools

# preflate cannot be built on Linux: `support/filestream.cpp` calls `_ftelli64` and
# `_fseeki64` unconditionally — MSVC-only names with no `#ifdef`. That is not a reason
# to have no preflate; it is a reason to build it where it compiles.
#
# This builds it on windows-latest with MSVC, proves it splits and recombines a file
# byte-exactly, and attaches the result with its source and licence (Apache-2.0 §4).
#
# It is a separate workflow from build-tools on purpose: that one builds the Linux
# bundle, and a Windows artefact has no business in it.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the zip to (leave empty to only build)'
        required: false
        default: ''
      hcs_ref:
        description: 'HCS ref to build preflate from'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  preflate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: The vault's preflate source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.hcs_ref }}" https://github.com/drsamonline/HCS.git hcs
          cd hcs
          git submodule update --init --depth 1 old/preflate-master
          test -f old/preflate-master/CMakeLists.txt || { echo "::error::preflate did not materialise"; exit 1; }
          echo "preflate at $(git -C old/preflate-master rev-parse HEAD)"

      - name: Configure with MSVC
        shell: bash
        run: |
          set -euo pipefail
          # preflate's CMakeLists asks for 3.2; CMake 4 refuses anything below 3.5 and
          # says so by naming the flag that overrides it.
          cmake -S hcs/old/preflate-master -B pfbuild -A x64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build the CLI
        shell: bash
        run: |
          set -euo pipefail
          # The CMake target is `preflate_demo` (main.cpp is the command-line front end;
          # main2.cpp is a second demo). Building just this one keeps the artefact small.
          cmake --build pfbuild --config Release --target preflate_demo
          find pfbuild -name 'preflate_demo*' -type f | head -5

      - name: It must split and recombine the same bytes
        shell: bash
        run: |
          set -euo pipefail
          exe="$(find pfbuild -name 'preflate_demo.exe' -type f | head -1)"
          test -n "$exe" || { echo "::error::no preflate_demo.exe"; exit 1; }
          "$exe" | head -5 || true
          # A real raw deflate stream, made with zlib: `zlib.compress` emits a 2-byte
          # zlib header and a 4-byte adler32, and stripping those leaves the deflate
          # stream preflate expects. Stripping gzip's framing instead does not work —
          # its header is variable length, and preflate rejects what is left
          # ("splitting s.deflate failed").
          head -c 120000 /dev/urandom | base64 > in.txt
          python -c "import zlib; d=open('in.txt','rb').read(); open('stream.deflate','wb').write(zlib.compress(d)[2:-4])"
          cp stream.deflate s.deflate
          "$exe" -s s.deflate
          test -f s.deflate.u || { echo "::error::split produced no .u"; exit 1; }
          test -f s.deflate.r || { echo "::error::split produced no .r"; exit 1; }
          "$exe" -x s.deflate
          cmp stream.deflate s.deflate.x
          echo "preflate split/recombine ok: $(stat -c%s stream.deflate 2>/dev/null || stat -f%z stream.deflate) bytes"

      - name: The adapter must give it one-file-in, one-file-out
        # preflate splits into FILE.u and FILE.r and recombines them; a heavenzip step
        # needs one file each way. tools/preflate-wrap.cmd carries the pair in a tar.
        # This is the only place the adapter can be tested: the binary is Windows-only.
        #
        # The path to the executable is written out rather than searched for: the first
        # version looped with `!exe!` and never enabled delayed expansion, so the
        # variable never expanded and the step failed on its own guard.
        shell: cmd
        run: |
          copy /y pfbuild\Release\preflate_demo.exe preflate.exe >nul || (echo ::error::no preflate_demo.exe & exit /b 1)
          copy /y tools\preflate-wrap.cmd . >nul || (echo ::error::no wrapper & exit /b 1)
          call preflate-wrap.cmd c stream.deflate wrapped.bin || (echo ::error::the adapter could not compress & exit /b 1)
          if not exist wrapped.bin (echo ::error::the adapter produced nothing & exit /b 1)
          call preflate-wrap.cmd d wrapped.bin restored.deflate || (echo ::error::the adapter could not restore & exit /b 1)
          if not exist restored.deflate (echo ::error::the adapter restored nothing & exit /b 1)
          fc /b stream.deflate restored.deflate >nul || (echo ::error::the adapter round trip differs & exit /b 1)
          echo adapter round trip ok

      - name: Package with its source and licence
        shell: bash
        run: |
          set -euo pipefail
          exe="$(find pfbuild -name 'preflate_demo.exe' -type f | head -1)"
          mkdir -p pkg/preflate-windows-x86_64
          cp "$exe" pkg/preflate-windows-x86_64/preflate.exe
          cp hcs/old/preflate-master/README.md pkg/preflate-windows-x86_64/ 2>/dev/null || true
          cp tools/preflate-wrap.cmd pkg/preflate-windows-x86_64/ 2>/dev/null || true
          cp hcs/LICENSES/APACHE-2.0.txt pkg/preflate-windows-x86_64/LICENSE 2>/dev/null || true
          git -C hcs/old/preflate-master archive --format=zip -o "$PWD/pkg/preflate-windows-x86_64/preflate-source.zip" HEAD
          cat > pkg/preflate-windows-x86_64/PROVENANCE.md <<EOF
          # preflate

          Built from HCS \`old/preflate-master\` at \`$(git -C hcs/old/preflate-master rev-parse HEAD)\`
          (HCS \`${{ inputs.hcs_ref }}\`), with MSVC and the upstream CMakeLists unchanged.

          **Windows only.** The source calls \`_ftelli64\` and \`_fseeki64\` unconditionally,
          so it does not compile on Linux or macOS. That is why this artefact exists
          separately from the Linux bundle.

          Licence: Apache-2.0 — see \`LICENSE\`. The source is included as
          \`preflate-source.zip\`.
          EOF
          # .tar.gz, not .zip: the tar in Git Bash is GNU tar, whose -a does not know
          # .zip, so `tar -a -cf x.zip` silently wrote a tar named .zip — an artefact
          # that fails to open. Same container as the Linux bundle instead.
          cd pkg && tar -czf preflate-windows-x86_64.tar.gz preflate-windows-x86_64
          ls -l
          sha256sum preflate-windows-x86_64.tar.gz > preflate-windows-x86_64.tar.gz.sha256
          # It must be readable as what it claims to be.
          tar -tzf preflate-windows-x86_64.tar.gz | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: preflate-windows-x86_64
          path: |
            pkg/preflate-windows-x86_64.tar.gz
            pkg/preflate-windows-x86_64.tar.gz.sha256

  publish:
    needs: preflate
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preflate-windows-x86_64
          path: pkg

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l pkg
          gh release upload "${{ inputs.release_tag }}" \
            pkg/preflate-windows-x86_64.tar.gz pkg/preflate-windows-x86_64.tar.gz.sha256 \
            --repo "${{ github.repository }}" --clobber
