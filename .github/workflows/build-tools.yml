name: build-tools

# heavenzip never builds a compressor. That rule is about the *orchestrator*: it
# links nothing and shells out to prebuilt binaries. But nobody else was building
# the tools either, so `bin/` only ever held the engine and every profile that
# needed paq8px refused.
#
# This builds paq8px from the vault with the system g++, smoke-tests it, and can
# attach it to a release. It builds rather than downloads because upstream
# publishes no Linux binary.
#
# Why g++ and not the zig toolchain the fleet uses locally: paq8px's CMakeLists
# passes GCC-only flags (`-floop-strip-mine`, `-fgcse-sm`), which clang rejects with
# `unknown clang option`. The runner has g++.
#
# Licence: paq8px is GPL-2+. It ships as a separate program in its own directory,
# with its source, and is never linked into heavenzip. See docs/PACKAGING.md.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the binary to (leave empty to only build)'
        required: false
        default: ''
      hcs_ref:
        description: 'HCS ref to build paq8px from'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  paq8px:
    runs-on: ubuntu-latest
    # Build inside an older glibc than the runner's. The first version of this
    # workflow built on ubuntu-latest and produced a binary demanding
    # `GLIBC_2.38` and `GLIBC_2.43` — unusable on Debian 12 (2.36), which is the
    # exact defect ziptastic 1.4.2 shipped with before its floor was fixed. The
    # container decides the floor, so it is stated rather than inherited.
    container: ubuntu:20.04
    # The image's default shell is `sh`, which has no `pipefail` — the first
    # container run died on `set: Illegal option -o pipefail` before checking
    # anything. Bash for every step in this job.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build tools first
        # The build image is a bare ubuntu:20.04: no git, no compiler. Installing
        # first, because the very next step clones and a container without git fails
        # there rather than here — which is what the first container run did.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build g++ git ca-certificates file binutils

      - name: The vault's paq8px source
        # HCS is not vendored here: heavenzip needs the binary, not the tree. The
        # submodule is the pin, so the build is reproducible from HCS's own record.
        run: |
          git clone --depth 1 --branch "${{ inputs.hcs_ref }}" https://github.com/drsamonline/HCS.git /tmp/hcs
          cd /tmp/hcs
          git submodule update --init --depth 1 old/paq8px
          test -f old/paq8px/CMakeLists.txt || { echo "::error::old/paq8px did not materialise"; exit 1; }
          echo "paq8px at $(git -C old/paq8px rev-parse HEAD)"

      - name: Configure
        run: cmake -S /tmp/hcs/old/paq8px -B /tmp/pqbuild -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build /tmp/pqbuild -j 2

      - name: The glibc floor must be the container's, not the runner's
        # A binary that builds but cannot start on the target platforms is the defect
        # this fleet has already paid for once. Read the symbol versions it actually
        # requires and fail if any is newer than the build image's glibc.
        #
        # No pipelines through `head`: under `set -o pipefail`, `ldd --version |
        # head -1` fails the step because head closes the pipe and ldd exits 141.
        # That is what the previous version of this step did — it reported nothing
        # and failed, which looks exactly like a broken gate.
        run: |
          set -euo pipefail
          PQ=/tmp/pqbuild/paq8px
          ceiling="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"
          echo "build image glibc: $ceiling"
          syms="$(objdump -T "$PQ" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu || true)"
          if [ -z "$syms" ]; then
            echo "::error::no GLIBC symbol versions found in $PQ — is it a static or a wrong binary?"
            exit 1
          fi
          worst="$(printf '%s\n' "$syms" | tail -1)"
          echo "highest symbol version required: $worst"
          newest="$(printf '%s\n%s\n' "$worst" "$ceiling" | sort -V | tail -1)"
          if [ "$newest" != "$ceiling" ]; then
            echo "::error::binary requires GLIBC_$worst but the build image only has $ceiling"
            exit 1
          fi
          echo "ok: nothing newer than the build image's own glibc ($ceiling)"

      - name: It must compress and restore the same bytes
        # A binary that builds but cannot round-trip is worse than none: it would be
        # bundled, pass `validate`, and fail on the user's file.
        run: |
          set -euo pipefail
          PQ=/tmp/pqbuild/paq8px
          test -x "$PQ" || { echo "::error::no paq8px binary"; exit 1; }
          "$PQ" 2>&1 | head -5 || true
          head -c 200000 /dev/urandom | base64 > /tmp/in.txt
          "$PQ" -5 /tmp/in.txt /tmp/out.paq
          "$PQ" -d /tmp/out.paq /tmp/back.txt
          cmp /tmp/in.txt /tmp/back.txt
          echo "round trip ok: $(stat -c%s /tmp/in.txt) B -> $(stat -c%s /tmp/out.paq) B"

      - name: Package it with its source and its licence
        # GPL-2+ means the source has to travel. Shipping the binary alone would be a
        # licence violation, which is the one thing this fleet is careful about.
        run: |
          set -euo pipefail
          mkdir -p pkg/paq8px
          cp /tmp/pqbuild/paq8px pkg/paq8px/paq8px
          cp /tmp/hcs/old/paq8px/README.md pkg/paq8px/ 2>/dev/null || true
          cp /tmp/hcs/old/paq8px/CHANGELOG pkg/paq8px/ 2>/dev/null || true
          # licence text: paq8px states it in its README and HCS collected the notice
          cp /tmp/hcs/LICENSES/GPL-2.0-only.txt pkg/paq8px/LICENSE 2>/dev/null || true
          git -C /tmp/hcs/old/paq8px archive --format=tar.gz -o "$PWD/pkg/paq8px/paq8px-source.tar.gz" HEAD
          cat > pkg/paq8px/PROVENANCE.md <<EOF
          # paq8px

          Built from HCS \`old/paq8px\` at \`$(git -C /tmp/hcs/old/paq8px rev-parse HEAD)\`
          (HCS \`${{ inputs.hcs_ref }}\`), with \`g++\` and the upstream CMakeLists unchanged.

          Licence: GPL-2.0-or-later — see \`LICENSE\`. The source is included as
          \`paq8px-source.tar.gz\`, because GPL-2 §3 requires it to travel with the
          binary. paq8px is spawned as a separate program and is never linked into
          heavenzip.
          EOF
          (cd pkg && tar -czf paq8px-linux-x86_64.tar.gz paq8px)
          sha256sum pkg/paq8px-linux-x86_64.tar.gz > pkg/paq8px-linux-x86_64.tar.gz.sha256
          ls -l pkg

      - name: zig and a newer cmake, inside the old-glibc container
        # heavenzip needs CMake >= 3.20 and C++20; ubuntu:20.04 has CMake 3.16 and
        # gcc 9. Rather than raise the glibc floor by moving to a newer image, the
        # container keeps its glibc 2.31 and gets a current cmake plus zig's clang,
        # which handles C++20 and cross-compiles against an older libc.
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-pip
          python3 -m pip install --quiet cmake ninja ziglang
          echo "cmake: $(python3 -c 'import cmake,os;print(os.path.join(cmake.CMAKE_BIN_DIR,"cmake"))')"
          python3 -m ziglang version
          cat > /usr/local/bin/zig-cxx <<'SH'
          #!/usr/bin/env bash
          exec python3 -m ziglang c++ "$@"
          SH
          cat > /usr/local/bin/zig-cc <<'SH'
          #!/usr/bin/env bash
          exec python3 -m ziglang cc "$@"
          SH
          chmod +x /usr/local/bin/zig-cxx /usr/local/bin/zig-cc

      - name: Build heavenzip with zig
        run: |
          set -euo pipefail
          CM=$(python3 -c 'import cmake,os;print(os.path.join(cmake.CMAKE_BIN_DIR,"cmake"))')
          "$CM" -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/local/bin/zig-cc \
            -DCMAKE_CXX_COMPILER=/usr/local/bin/zig-cxx
          "$CM" --build build -j 2
          ./build/heavenzip version

      - name: Build srep with zig
        # srep has no licence file and no statement granting redistribution, so the
        # bundle carries its SOURCE and this build recipe, and NOTICE says exactly
        # that. Building it here rather than shipping a binary of unlicensed code is
        # the difference between "included" and "redistributed".
        run: |
          set -euo pipefail
          mkdir -p /tmp/shim/sys && : > /tmp/shim/sys/sysctl.h
          cd /tmp/hcs/old/srep-main
          zig-cxx -I/tmp/shim -target x86_64-linux-gnu.2.28 \
            -ICompression -ICompression/_Encryption \
            -ICompression/_Encryption/headers -ICompression/_Encryption/hashes \
            -DFREEARC_UNIX -DFREEARC_INTEL_BYTE_ORDER -D_FILE_OFFSET_BITS=64 \
            -O3 -msse2 -Wno-write-strings -Wno-unused-result \
            -o /tmp/srep Compression/Common.cpp Compression/SREP/srep.cpp \
            -lpthread -lstdc++
          /tmp/srep -h >/dev/null 2>&1 || true
          echo "srep built: $(stat -c%s /tmp/srep) bytes"

      - name: srep must round-trip
        run: |
          set -euo pipefail
          head -c 200000 /dev/urandom | base64 > /tmp/s.txt
          /tmp/srep -l4k -m1f /tmp/s.txt /tmp/s.srep
          /tmp/srep -d /tmp/s.srep /tmp/s.back
          cmp /tmp/s.txt /tmp/s.back
          echo "srep round trip ok"

      - name: Fetch the engine
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends curl
          tag="$(curl -fsSL https://api.github.com/repos/drsamonline/ziptastic/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)"
          echo "engine release: $tag"
          # Download under the release's own asset name: `sha256sum -c` matches on
          # the name recorded in SHA256SUMS, and saving it as `engine` made the
          # check fail with "No such file or directory" while the file was right there.
          asset="ziptastic-${tag#v}-linux-x86_64"
          curl -fsSL -o "/tmp/$asset" "https://github.com/drsamonline/ziptastic/releases/download/$tag/$asset"
          curl -fsSL -o /tmp/SHA256SUMS "https://github.com/drsamonline/ziptastic/releases/download/$tag/SHA256SUMS"
          ( cd /tmp && grep " $asset$" SHA256SUMS | sha256sum -c - )
          echo "ENGINE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Assemble the bundle
        run: |
          set -euo pipefail
          rm -rf stage && mkdir -p stage/heavenzip/bin stage/heavenzip/docs \
                                  stage/heavenzip/sources
          cp build/heavenzip stage/heavenzip/
          cp "/tmp/ziptastic-${ENGINE_TAG#v}-linux-x86_64" stage/heavenzip/bin/ziptastic
          cp /tmp/pqbuild/paq8px stage/heavenzip/bin/paq8px
          cp /tmp/srep stage/heavenzip/bin/srep
          cp -r config stage/heavenzip/config
          cp LICENSE NOTICE README.md stage/heavenzip/
          cp docs/PACKAGING.md docs/TOOL_MANIFEST.md docs/PROFILES.md stage/heavenzip/docs/
          # sources for everything that is GPL or has no licence at all
          git -C /tmp/hcs/old/paq8px archive --format=tar.gz -o "$PWD/stage/heavenzip/sources/paq8px-source.tar.gz" HEAD
          ( cd /tmp/hcs/old/srep-main && tar --exclude=.git -czf "$OLDPWD/stage/heavenzip/sources/srep-source.tar.gz" . )
          cp /tmp/hcs/LICENSES/GPL-2.0-only.txt stage/heavenzip/sources/paq8px-LICENSE 2>/dev/null || true
          cp /tmp/hcs/LICENSES/APACHE-2.0.txt stage/heavenzip/sources/preflate-LICENSE 2>/dev/null || true
          printf 'tag      %s\nasset    ziptastic-%s-linux-x86_64\nsha256   %s\nfetched  %s\n' \
            "$ENGINE_TAG" "${ENGINE_TAG#v}" "$(sha256sum stage/heavenzip/bin/ziptastic | cut -d' ' -f1)" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > stage/heavenzip/bin/ENGINE
          ( cd stage/heavenzip && sha256sum bin/ziptastic bin/paq8px bin/srep heavenzip > SHA256SUMS )
          ( cd stage && tar -czf heavenzip-linux-x86_64.tar.gz heavenzip )
          sha256sum stage/heavenzip-linux-x86_64.tar.gz > stage/heavenzip-linux-x86_64.tar.gz.sha256
          ( cd stage && tar -xzf heavenzip-linux-x86_64.tar.gz && cd heavenzip &&
            ./heavenzip validate | tail -2 &&
            echo "bundle round trip" > rt.txt &&
            ./heavenzip compress rt.txt >/dev/null &&
            ./heavenzip decompress rt.txt.hzpkg --out back.txt >/dev/null &&
            cmp rt.txt back.txt && echo "bundle round-trips" )

      - uses: actions/upload-artifact@v4
        with:
          name: heavenzip-bundle
          path: |
            stage/heavenzip-linux-x86_64.tar.gz
            stage/heavenzip-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: paq8px-linux-x86_64
          path: |
            pkg/paq8px-linux-x86_64.tar.gz
            pkg/paq8px-linux-x86_64.tar.gz.sha256

  publish:
    # The build container is ubuntu:20.04 for its glibc, and it has no `gh` — the
    # first attempt to attach from inside it died with `gh: command not found`.
    # Publishing belongs on the runner, which has the CLI and the token.
    needs: paq8px
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paq8px-linux-x86_64
          path: pkg

      - uses: actions/download-artifact@v4
        with:
          name: heavenzip-bundle
          path: pkg-bundle

      - uses: actions/download-artifact@v4
        with:
          name: heavenzip-bundle
          path: pkg-bundle

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l pkg pkg-bundle
          gh release upload "${{ inputs.release_tag }}" \
            pkg/paq8px-linux-x86_64.tar.gz pkg/paq8px-linux-x86_64.tar.gz.sha256 \
            pkg-bundle/heavenzip-linux-x86_64.tar.gz pkg-bundle/heavenzip-linux-x86_64.tar.gz.sha256 \
            --repo "${{ github.repository }}" --clobber
